[package]
name = "mpegts-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Mirror the library's features, so the shared harness in
# tests/harness/mod.rs sees the same `cfg(feature = ...)` as the tests.
[features]
default = ["capi", "mux"]
capi = ["mpegts/capi"]
mux = ["mpegts/mux"]

[dependencies]
libfuzzer-sys = "0.4"
mpegts = { path = "..", default-features = false }

# Not part of the main crate's build.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "demux"
path = "fuzz_targets/demux.rs"
test = false
doc = false
bench = false

[[bin]]
name = "stream"
path = "fuzz_targets/stream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "capi"
path = "fuzz_targets/capi.rs"
required-features = ["capi"]
test = false
doc = false
bench = false

[[bin]]
name = "mux"
path = "fuzz_targets/mux.rs"
required-features = ["mux"]
test = false
doc = false
bench = false

[[bin]]
name = "inject"
path = "fuzz_targets/inject.rs"
required-features = ["mux"]
test = false
doc = false
bench = false

[[bin]]
name = "nal"
path = "fuzz_targets/nal.rs"
test = false
doc = false
bench = false
