name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # On Linux this includes the C tests: layout, exported symbols, and
      # `make install` followed by pkg-config and CMake builds.
      - run: cargo test --all-features

  warnings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-targets --all-features
        env:
          RUSTFLAGS: -D warnings
      # Every feature set builds cleanly: without the C ABI (unsafe code
      # forbidden), and the write side on its own.
      - run: |
          cargo build --lib --no-default-features
          cargo build --lib --no-default-features --features mux
          cargo test --no-default-features --features mux --no-run
        env:
          RUSTFLAGS: -D warnings
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.70
      # The optional serde feature's dependencies need a newer compiler.
      - run: cargo check --lib
      - run: cargo check --lib --features mux

  c-package-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: make install
        run: make install PREFIX="$RUNNER_TEMP/prefix"
      - name: build the example with CMake, shared and static
        run: |
          for static in OFF ON; do
            cmake -S examples/c -B "build-$static" -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/prefix" -DMPEGTS_STATIC=$static
            cmake --build "build-$static"
            "./build-$static/klv_dump" /dev/null
          done
      - name: make uninstall
        run: |
          make uninstall PREFIX="$RUNNER_TEMP/prefix"
          test -z "$(find "$RUNNER_TEMP/prefix" -type f)"

  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [demux, stream, capi, mux, inject]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: fuzz for two minutes
        run: cargo fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} -- -max_total_time=120 -max_len=16384
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts

  oracles:
    # External validators on the injector's output (MUXING_PLAN.md 7.4):
    # TSDuck's continuity and PCR checks and tsanalyze. The patched FFmpeg
    # oracle (MPEGTS_FFPROBE, MPEGTS_FFMPEG) runs where it is built.
    runs-on: ubuntu-24.04
    env:
      TSDUCK_VERSION: 3.45-4798
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install TSDuck from its release package
        run: |
          curl -fsSL -o "$RUNNER_TEMP/tsduck.deb" \
            "https://github.com/tsduck/tsduck/releases/download/v${TSDUCK_VERSION}/tsduck_${TSDUCK_VERSION}.ubuntu24_amd64.deb"
          sudo apt-get update
          sudo apt-get install -y "$RUNNER_TEMP/tsduck.deb"
          tsp --version
      - name: injected streams through TSDuck
        run: cargo test --features mux --test inject -- tsduck --nocapture
        env:
          MPEGTS_TSDUCK: /usr/bin

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5

  # One check for branch protection to require, instead of every job.
  ci-result:
    name: CI result
    if: always()
    needs: [test, warnings, msrv, c-package-macos, fuzz, oracles]
    runs-on: ubuntu-latest
    steps:
      - name: all jobs passed
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = false
