name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # On Linux this includes the C tests: layout, exported symbols, and
      # `make install` followed by pkg-config and CMake builds.
      - run: cargo test --all-features

  warnings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-targets --all-features
        env:
          RUSTFLAGS: -D warnings
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.70
      # The optional serde feature's dependencies need a newer compiler.
      - run: cargo check --lib

  c-package-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: make install
        run: make install PREFIX="$RUNNER_TEMP/prefix"
      - name: build the example with CMake, shared and static
        run: |
          for static in OFF ON; do
            cmake -S examples/c -B "build-$static" -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/prefix" -DMPEGTS_STATIC=$static
            cmake --build "build-$static"
            "./build-$static/klv_dump" /dev/null
          done
      - name: make uninstall
        run: |
          make uninstall PREFIX="$RUNNER_TEMP/prefix"
          test -z "$(find "$RUNNER_TEMP/prefix" -type f)"

  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [demux, stream, capi]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: fuzz for two minutes
        run: cargo fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} -- -max_total_time=120 -max_len=16384
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts
